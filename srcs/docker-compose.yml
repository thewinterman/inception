services:
	mariadb:
		build:
			context: ./requirements/mariadb
		image: mariadb:1.0
		restart: unless-stopped
		secrets:
			- mariadb_database
			- mariadb_user
			- mariadb_password
			- mariadb_root_password
		environment:
			MARIADB_DATABASE_FILE: /run/secrets/mariadb_database
			MARIADB_USER_FILE: /run/secrets/mariadb_user
			MARIADB_PASSWORD_FILE: /run/secrets/mariadb_password
			MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
		volumes:
			- mariadb_data:/var/lib/mysql
		networks:
			- inception

	wordpress:
		build:
			context: ./requirements/wordpress
		image: wordpress:1.0
		restart: unless-stopped
		depends_on:
			- mariadb
		secrets:
			- mariadb_database
			- mariadb_user
			- mariadb_password
			- wordpress_admin_password
			- wordpress_user_password
		environment:
			WORDPRESS_DB_HOST: mariadb:3306
			WORDPRESS_DB_NAME_FILE: /run/secrets/mariadb_database
			WORDPRESS_DB_USER_FILE: /run/secrets/mariadb_user
			WORDPRESS_DB_PASSWORD_FILE: /run/secrets/mariadb_password
			WORDPRESS_URL: https://${DOMAIN_NAME:?DOMAIN_NAME must be set}
			WORDPRESS_TITLE: ${WORDPRESS_TITLE:?WORDPRESS_TITLE must be set}
			WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:?WORDPRESS_ADMIN_USER must be set}
			WORDPRESS_ADMIN_PASSWORD_FILE: /run/secrets/wordpress_admin_password
			WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:?WORDPRESS_ADMIN_EMAIL must be set}
			WORDPRESS_USER: ${WORDPRESS_USER:?WORDPRESS_USER must be set}
			WORDPRESS_USER_PASSWORD_FILE: /run/secrets/wordpress_user_password
			WORDPRESS_USER_EMAIL: ${WORDPRESS_USER_EMAIL:?WORDPRESS_USER_EMAIL must be set}
		volumes:
			- wordpress_data:/var/www/html
		networks:
			- inception

	nginx:
		build:
			context: ./requirements/nginx
		image: nginx:1.0
		restart: unless-stopped
		depends_on:
			- wordpress
		environment:
			DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME must be set}
		ports:
			- "443:443"
		volumes:
			- wordpress_data:/var/www/html:ro
		networks:
			- inception

volumes:
	mariadb_data:
		name: mariadb_data
		driver: local
		driver_opts:
			type: none
			o: bind
			device: ${MARIADB_DATA_PATH:?MARIADB_DATA_PATH must be set}
	wordpress_data:
		name: wordpress_data
		driver: local
		driver_opts:
			type: none
			o: bind
			device: ${WORDPRESS_DATA_PATH:?WORDPRESS_DATA_PATH must be set}

networks:
	inception:
		name: inception
		driver: bridge

secrets:
	mariadb_database:
		file: ../secrets/mariadb_database.txt
	mariadb_user:
		file: ../secrets/mariadb_user.txt
	mariadb_password:
		file: ../secrets/mariadb_password.txt
	mariadb_root_password:
		file: ../secrets/mariadb_root_password.txt
	wordpress_admin_password:
		file: ../secrets/wordpress_admin_password.txt
	wordpress_user_password:
		file: ../secrets/wordpress_user_password.txt
